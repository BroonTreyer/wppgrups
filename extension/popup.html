<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:system-ui,sans-serif;background:#0b1118;color:#e8edf2;width:330px;margin:0;padding:16px}
    h1{font-size:15px;margin:0 0 4px;color:#59e391}
    p.sub{margin:0 0 14px;color:#8da2b6;font-size:12px}
    label{display:block;font-size:12px;color:#8da2b6;margin:10px 0 4px}
    input{width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #34485e;background:#0c151f;color:#fff;font-size:13px}
    button{margin-top:12px;width:100%;padding:10px;border-radius:8px;border:1px solid #20a663;background:#167d4a;color:#fff;font-size:14px;cursor:pointer}
    button.secondary{background:#243447;border-color:#34485e;margin-top:8px}
    .status{margin-top:12px;padding:10px;border-radius:8px;background:#0c151f;font-size:12px;line-height:1.6}
    .ok{color:#59e391}.bad{color:#ff7b7b}.warn{color:#ffcb66}
  </style>
</head>
<body>
  <h1>OfertaFlow</h1>
  <p class="sub">Gera os links de afiliado no seu Chrome logado.</p>

  <label>Endereço do OfertaFlow</label>
  <input id="server" placeholder="http://localhost:3000">

  <label>ADMIN_TOKEN</label>
  <input id="token" type="password" placeholder="cole o token do painel">

  <label>Página do gerador de links</label>
  <input id="builderUrl" placeholder="https://www.mercadolivre.com.br/afiliados/linkbuilder">

  <hr style="border:0;border-top:1px solid #243447;margin:16px 0 4px">
  <label style="color:#59e391">Colheita nas lojas das marcas</label>
  <p class="sub" style="margin:2px 0 6px">Uma página por linha. O servidor não consegue ler essas páginas sozinho — o seu Chrome consegue.</p>
  <label style="display:flex;align-items:center;gap:8px;margin:6px 0">
    <input id="harvestEnabled" type="checkbox" style="width:auto;margin:0"> Colher a cada 30 min
  </label>
  <label>Páginas por marca (50 produtos cada)</label>
  <input id="harvestPages" type="number" min="1" max="10" placeholder="3">
  <textarea id="harvestUrls" rows="4" placeholder="https://www.mercadolivre.com.br/loja/natura&#10;https://www.mercadolivre.com.br/loja/oboticario"
    style="width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #34485e;background:#0c151f;color:#fff;font-size:12px;font-family:inherit"></textarea>

  <button id="save">Salvar</button>
  <button id="run" class="secondary">Gerar links pendentes agora</button>
  <button id="harvest" class="secondary">Colher as lojas agora</button>

  <div class="status" id="status">Carregando…</div>
  <script src="popup.js"></script>
</body>
</html>
