<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OfertaFlow</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e8edf2;background:#0b1118}body{max-width:1100px;margin:0 auto;padding:32px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}h1{margin:0;color:#59e391}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.card{background:#131d28;border:1px solid #233244;border-radius:14px;padding:18px}.wide{grid-column:1/-1}input,button{border-radius:8px;border:1px solid #34485e;padding:10px;background:#0c151f;color:#fff}button{cursor:pointer;background:#167d4a;border-color:#20a663}button:hover{background:#1b9659}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #263747}.muted{color:#8da2b6}.ok{color:#59e391}.warn{color:#ffcb66}@media(max-width:760px){main{grid-template-columns:1fr}.wide{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header><div><h1>OfertaFlow</h1><div class="muted">Painel operacional do bot</div></div><div><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="saveToken()">Salvar token</button></div></header>
  <main>
    <section class="card"><h2>Sistema</h2><div id="health">Carregando...</div></section>
    <section class="card"><h2>Ações</h2><button onclick="sync()">Sincronizar Z-API</button> <button onclick="demo()">Adicionar oferta demo</button> <button onclick="processQueue()">Processar fila</button></section>
    <section class="card wide"><h2>Destinos</h2><div id="destinations"></div></section>
    <section class="card wide"><h2>Fila de ofertas</h2><div id="queue"></div></section>
  </main>
  <script>
    const token = document.querySelector("#token");
    token.value = localStorage.getItem("ofertaflow-token") || "";
    const auth = () => ({Authorization: `Bearer ${token.value}`, "Content-Type":"application/json"});
    async function api(path, options={}) { const response=await fetch(path,{...options,headers:{...auth(),...options.headers}}); const body=await response.json(); if(!response.ok) throw new Error(body.error||"Erro"); return body; }
    function saveToken(){localStorage.setItem("ofertaflow-token",token.value);refresh()}
    async function sync(){try{await api("/api/destinations/sync",{method:"POST"});refresh()}catch(e){alert(e.message)}}
    async function demo(){try{await api("/api/demo/enqueue",{method:"POST"});refresh()}catch(e){alert(e.message)}}
    async function processQueue(){try{await api("/api/queue/process",{method:"POST"});refresh()}catch(e){alert(e.message)}}
    const table=(rows,cols)=>rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table>`:"<span class=muted>Nenhum registro.</span>";
    async function refresh(){
      const h=await fetch("/health").then(r=>r.json());document.querySelector("#health").innerHTML=`<b class=ok>Online</b><br>Modo seguro: <b class=${h.dryRun?"warn":"ok"}>${h.dryRun?"ATIVO":"ENVIO REAL"}</b>`;
      if(!token.value)return;
      try{
        const [d,q]=await Promise.all([api("/api/destinations"),api("/api/queue")]);
        document.querySelector("#destinations").innerHTML=table(d,[["Nome",x=>x.name],["Tipo",x=>x.type],["Limite/dia",x=>x.maxDailyPosts],["Intervalo",x=>x.minMinutesBetweenPosts+" min"],["Ativo",x=>x.active?"Sim":"Não"]]);
        document.querySelector("#queue").innerHTML=table(q,[["Produto",x=>x.offer.title],["Score",x=>x.score],["Status",x=>x.status],["Tentativas",x=>x.attempts]]);
      }catch(e){document.querySelector("#destinations").innerHTML=`<span class=warn>${e.message}</span>`}
    }refresh();setInterval(refresh,15000);
  </script>
</body>
</html>
